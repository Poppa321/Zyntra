spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      max-lifetime: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 20
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

zyntra:
  rate-limit:
    # General per-user (or per-IP when unauthenticated) cap across the API,
    # excluding /api/auth/** which has its own dedicated limiters. See
    # RateLimitFilter.
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  cors:
    # Defaults cover local web dev only — set CORS_ALLOWED_ORIGINS in prod
    # (comma-separated, e.g. "https://app.zyntra.dev,https://*.zyntra.dev").
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 1440
  # Shared key gating GET /api/admin/** (see AdminController) — not tied to
  # the user auth system since there's no admin role yet. Blank means the
  # endpoint always rejects.
  admin-dashboard-key: ${ADMIN_DASHBOARD_KEY:}
  google:
    # Comma-separated Web/iOS/Android OAuth client IDs from Google Cloud Console
    # — the ID token's "aud" claim must match one of these, or the token is
    # rejected. Left blank, Google sign-in is rejected outright rather than
    # skipping the audience check.
    client-id: ${GOOGLE_CLIENT_ID:}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY}
    base-url: https://api.paystack.co
    # Must be http(s) — Paystack's hosted checkout won't reliably redirect to a
    # bare custom scheme. PaymentRedirectController bridges from here into the
    # app's zyntra://payment/callback deep link.
    callback-url: ${PAYSTACK_CALLBACK_URL:https://zyntra-5wo1.onrender.com/api/payments/redirect}
  twilio:
    # SMS/WhatsApp delivery-tracking fallback. Left blank, DeliveryMessagingService
    # logs and no-ops instead of failing — same graceful-degradation pattern as
    # Google sign-in's blank client-id. Set all three (from Twilio Console) to
    # activate: account-sid, auth-token, and sms-from (a Twilio phone number).
    # whatsapp-from defaults to Twilio's public sandbox number — replace with an
    # approved WhatsApp sender for anything beyond sandbox testing.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:+14155238886}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only health is public-facing (see SecurityConfig); no metrics/env/beans
        # dumps exposed over HTTP.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
